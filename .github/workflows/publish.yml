name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check if already tagged
        id: check
        run: |
          TAG=$(git describe --exact-match --tags 2>/dev/null || echo "")
          if [[ -n "$TAG" ]]; then
            echo "Already tagged as $TAG, skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version, commit, tag, and publish
        if: steps.check.outputs.skip != 'true'
        id: bump
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const [major, minor, patch] = pkg.version.split('.').map(Number);
            const newVersion = major + '.' + minor + '.' + (patch + 1);
            console.log('Bumping ' + pkg.version + ' -> ' + newVersion);
            pkg.version = newVersion;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json
          git commit -m "chore: bump version"
          git tag "v$(node -p "require('./package.json').version")"
          git push origin main --follow-tags
          echo "@deansasek:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
          npm publish

      - name: Log skipped run
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "Version ${{ steps.check.outputs.tag }} already published, skipping"
