name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure npm for GitHub Packages (root)
        run: |
          echo "@deansasek:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc

      - name: Set SDK version
        run: |
          VERSION="0.0.${{ github.run_id }}"
          npm pkg set version=$VERSION

      - name: Publish SDK
        run: npm publish || true

      - name: Set MCP package version
        run: |
          VERSION="0.0.${{ github.run_id }}"
          cd mcp
          npm pkg set version=$VERSION

      - name: Publish MCP package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd mcp
          npm publish || true
