name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check if already tagged
        id: check
        run: |
          TAG=$(git describe --exact-match --tags 2>/dev/null || echo "")
          if [[ -n "$TAG" ]]; then
            echo "Already tagged as $TAG, skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version, commit, tag, and publish
        if: steps.check.outputs.skip != 'true'
        id: bump
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEW_VERSION="${major}.${minor}.$((patch + 1))"
          echo "Bumping $CURRENT -> $NEW_VERSION"
          node -e "
            const fs=require('fs');
            const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version=process.env.NEW_VERSION;
            fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          "
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin main --follow-tags
          echo "@deansasek:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
          npm publish

      - name: Log skipped run
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "Version ${{ steps.check.outputs.tag }} already published, skipping"
