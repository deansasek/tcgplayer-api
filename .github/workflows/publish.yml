name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get SDK version
        id: sdk-version
        run: |
          VERSION=$(npm version patch --no-git-tag-version)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure npm for GitHub Packages
        run: |
          echo "@deansasek:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc

      - name: Publish SDK
        run: npm publish

      - name: Update MCP package version
        working-directory: mcp
        run: npm version ${{ steps.sdk-version.outputs.VERSION }} --no-git-tag-version

      - name: Publish MCP package
        working-directory: mcp
        run: npm publish
